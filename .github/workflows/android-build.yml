name: Build Android APK Direct

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull project code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Set up Java JDK required by Gradle
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Convert Expo configuration into native /android folder
      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android

      # 6. Make Gradle wrapper executable and compile Release APK
      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 7. Upload generated APK as a downloadable GitHub Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
